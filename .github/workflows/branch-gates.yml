name: Branch gates

# Runs the development gates on a work branch pushed as ci/<name> (tools/ci_gates.py push),
# so the long test runs happen on GitHub's runners instead of the owner's PC.
# Verification only: read-only token, no secrets, no release, no tag, no push, nothing
# published. It never touches develop or enhanced.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to check (default: the branch the run was started on)'
        required: false
        default: ''

permissions:
  contents: read

# A newer push to the same ci/ branch cancels the older run.
concurrency:
  group: branch-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'

jobs:
  tests:
    if: github.repository == 'LoopRook/eqoa-enhanced'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: branch-gates-tests
      - name: Prepare logs
        shell: pwsh
        run: |
          $canonicalTemp = (python -c "import os; print(os.path.realpath(os.environ['RUNNER_TEMP']))").Trim()
          foreach ($name in @('TMPDIR', 'TEMP', 'TMP')) { "$name=$canonicalTemp" >> $env:GITHUB_ENV }
          "EQOA_CONFIG=$canonicalTemp\eqoa-gates-config" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$canonicalTemp\eqoa-gates-config" | Out-Null
          # Logs live outside the checkout so the footprint and paths checks never see them.
          "GATE_LOGS=$canonicalTemp\gate-logs" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$canonicalTemp\gate-logs" | Out-Null
      # Each gate keeps going after a failure so one run reports every result; the
      # last step fails the job when any gate failed. No disc is present here, so the
      # disc tests log SKIP; the summary counts them.
      - name: addons
        id: addons
        continue-on-error: true
        shell: pwsh
        run: |
          cargo +1.99.1 test --locked -p eqoa --bin eqoa --target x86_64-pc-windows-msvc fork_ext::addons:: -- --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/addons.log
          if ($LASTEXITCODE -ne 0) { throw 'addons failed' }
      - name: full
        id: full
        continue-on-error: true
        shell: pwsh
        run: |
          # Upstream's AO test `the_foot_of_a_wall_darkened_and_open_ground_not` needs the GPU
          # (it fails on untouched upstream and on this runner); skipped as enhanced-dev does.
          cargo +1.99.1 test --locked --workspace --target x86_64-pc-windows-msvc -- --test-threads=1 --nocapture --skip the_foot_of_a_wall_darkened_and_open_ground_not 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/full.log
          if ($LASTEXITCODE -ne 0) { throw 'full failed' }
      - name: Summarize
        if: always()
        shell: pwsh
        env:
          GATE_ADDONS: ${{ steps.addons.outcome }}
          GATE_FULL: ${{ steps.full.outcome }}
        run: |
          python -X utf8 tools/ci_gates.py summarize --job tests --logs $env:GATE_LOGS --out $env:GATE_LOGS/summary.json --markdown $env:GITHUB_STEP_SUMMARY --result addons=$env:GATE_ADDONS --result full=$env:GATE_FULL
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-summary-tests
          path: ${{ env.GATE_LOGS }}
          retention-days: 7
      - name: Fail when a gate failed
        if: steps.addons.outcome != 'success' || steps.full.outcome != 'success'
        shell: pwsh
        run: throw 'A gate failed (see the summary)'

  checks:
    if: github.repository == 'LoopRook/eqoa-enhanced'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch reviewed upstream policy base
        shell: pwsh
        run: |
          $base = (Get-Content docs/fork-footprint.json -Raw | ConvertFrom-Json).reviewed_base
          git fetch --no-tags https://github.com/DabDavis/eqoa-rust-client-vanilla.git $base
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch reviewed upstream base' }
          git update-ref refs/remotes/origin/master $base
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: branch-gates-checks
      - name: Prepare logs
        shell: pwsh
        run: |
          $canonicalTemp = (python -c "import os; print(os.path.realpath(os.environ['RUNNER_TEMP']))").Trim()
          foreach ($name in @('TMPDIR', 'TEMP', 'TMP')) { "$name=$canonicalTemp" >> $env:GITHUB_ENV }
          "EQOA_CONFIG=$canonicalTemp\eqoa-gates-config" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$canonicalTemp\eqoa-gates-config" | Out-Null
          # Logs live outside the checkout so the footprint and paths checks never see them.
          "GATE_LOGS=$canonicalTemp\gate-logs" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "$canonicalTemp\gate-logs" | Out-Null
      - name: wasm
        id: wasm
        continue-on-error: true
        shell: pwsh
        run: |
          cargo +1.99.1 check --locked -p eqoa --target wasm32-unknown-unknown 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/wasm.log
          if ($LASTEXITCODE -ne 0) { throw 'wasm failed' }
      - name: program
        id: program
        continue-on-error: true
        shell: pwsh
        run: |
          # The client as a program, not its tests: a test-only function called from normal code passes every test gate.
          cargo +1.99.1 check --locked -p eqoa 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/program.log
          if ($LASTEXITCODE -ne 0) { throw 'program failed' }
      - name: footprint
        id: footprint
        continue-on-error: true
        shell: pwsh
        run: |
          python -X utf8 tools/check_fork_footprint.py 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/footprint.log
          if ($LASTEXITCODE -ne 0) { throw 'footprint failed' }
      - name: paths
        id: paths
        continue-on-error: true
        shell: pwsh
        run: |
          python -X utf8 tools/check_no_local_paths.py 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/paths.log
          if ($LASTEXITCODE -ne 0) { throw 'paths failed' }
      - name: player-release
        id: player_release
        continue-on-error: true
        shell: pwsh
        run: |
          python -X utf8 tools/test_player_release.py 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/player-release.log
          if ($LASTEXITCODE -ne 0) { throw 'player-release failed' }
      - name: tools
        id: tools
        continue-on-error: true
        shell: pwsh
        run: |
          python -X utf8 -m unittest discover -s tools -p "test_*.py" 2>&1 | Tee-Object -FilePath $env:GATE_LOGS/tools.log
          if ($LASTEXITCODE -ne 0) { throw 'tools failed' }
      - name: Summarize
        if: always()
        shell: pwsh
        env:
          GATE_WASM: ${{ steps.wasm.outcome }}
          GATE_PROGRAM: ${{ steps.program.outcome }}
          GATE_FOOTPRINT: ${{ steps.footprint.outcome }}
          GATE_PATHS: ${{ steps.paths.outcome }}
          GATE_PLAYER: ${{ steps.player_release.outcome }}
          GATE_TOOLS: ${{ steps.tools.outcome }}
        run: |
          python -X utf8 tools/ci_gates.py summarize --job checks --logs $env:GATE_LOGS --out $env:GATE_LOGS/summary.json --markdown $env:GITHUB_STEP_SUMMARY --result wasm=$env:GATE_WASM --result program=$env:GATE_PROGRAM --result footprint=$env:GATE_FOOTPRINT --result paths=$env:GATE_PATHS --result player-release=$env:GATE_PLAYER --result tools=$env:GATE_TOOLS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-summary-checks
          path: ${{ env.GATE_LOGS }}
          retention-days: 7
      - name: Fail when a gate failed
        if: steps.wasm.outcome != 'success' || steps.program.outcome != 'success' || steps.footprint.outcome != 'success' || steps.paths.outcome != 'success' || steps.player_release.outcome != 'success' || steps.tools.outcome != 'success'
        shell: pwsh
        run: throw 'A gate failed (see the summary)'

  # The mod host on Linux and macOS. Nobody here plays on those systems, so these runners are
  # the proof: the client as a program, then the host's tests (no disc, no GPU: SKIPs are counted).
  unix:
    if: github.repository == 'LoopRook/eqoa-enhanced'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
          - os: macos
            runner: macos-15
    name: unix (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      # cpal (ALSA) and gilrs (libudev) link these, as upstream's dev.yml installs them.
      - name: Install the Linux libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: branch-gates-unix-${{ matrix.os }}
      - name: Prepare logs
        run: |
          mkdir -p "$RUNNER_TEMP/gate-logs" "$RUNNER_TEMP/eqoa-gates-config"
          echo "GATE_LOGS=$RUNNER_TEMP/gate-logs" >> "$GITHUB_ENV"
          echo "EQOA_CONFIG=$RUNNER_TEMP/eqoa-gates-config" >> "$GITHUB_ENV"
      - name: unix-program
        id: program
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.99.1 check --locked -p eqoa 2>&1 | tee "$GATE_LOGS/unix-program.log"
      - name: unix-addons
        id: addons
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # These tests need a GPU adapter, which a Linux runner lacks (the Windows runner has WARP and runs them);
          # macOS has one and runs them. The report names them as not run on Linux.
          SKIPS=()
          if [ "${{ matrix.os }}" = linux ]; then
            SKIPS=(--skip a_hidden_loot_session_that_ends_without_a_packet_is_gone_on_the_next_drawn_frame --skip owner1125b_auto_loot_switched_on_after_the_kill_takes_your_recent_kill --skip owner_h_sell_junk_puts_the_players_own_target_back --skip trade_window_an_error_in_an_always_on_listener_lets_both_claims_go_and_the_games_windows_come_back --skip round4_live_capture_quota_lifecycle_and_device_cleanup --skip round4_live_texture_quota_returns_nil_error --skip round4b_fix_existing_profile_enables_packaged_map_mods_and_keeps_manual_off)
          fi
          cargo +1.99.1 test --locked -p eqoa --bin eqoa fork_ext::addons:: -- --test-threads=1 --nocapture "${SKIPS[@]}" 2>&1 | tee "$GATE_LOGS/unix-addons.log"
      - name: Summarize
        if: always()
        shell: bash
        env:
          GATE_PROGRAM: ${{ steps.program.outcome }}
          GATE_ADDONS: ${{ steps.addons.outcome }}
        run: |
          python -X utf8 tools/ci_gates.py summarize --job ${{ matrix.os }} --logs "$GATE_LOGS" --out "$GATE_LOGS/summary.json" --markdown "$GITHUB_STEP_SUMMARY" --result unix-program="$GATE_PROGRAM" --result unix-addons="$GATE_ADDONS"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gate-summary-${{ matrix.os }}
          path: ${{ env.GATE_LOGS }}
          retention-days: 7
      - name: Fail when a gate failed
        if: steps.program.outcome != 'success' || steps.addons.outcome != 'success'
        run: |
          echo 'A gate failed (see the summary)'
          exit 1

name: Nightly build

# Builds and tests every push to develop, then refreshes the rolling prerelease
# tag dev. Stable players follow releases/latest/download/ and never see it.
on:
  push:
    branches: [develop]
    # Documentation alone changes nothing a player runs, so it offers no update.
    # Top-level *.md only: bundled-mods/**/README.md is built into the game.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'LoopRook/eqoa-enhanced'
    runs-on: windows-2022
    # A newer push cancels an older build, never a publication in progress.
    concurrency:
      group: enhanced-dev-build
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch develop for the ancestry check
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch develop' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Canonical Windows scratch directories
        shell: pwsh
        run: |
          $canonicalTemp = (python -c "import os; print(os.path.realpath(os.environ['RUNNER_TEMP']))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $canonicalTemp -PathType Container)) { throw 'Cannot resolve runner temporary directory' }
          foreach ($name in @('TMPDIR', 'TEMP', 'TMP')) { "$name=$canonicalTemp" >> $env:GITHUB_ENV }
      - name: Validate the development commit
        id: source
        shell: pwsh
        run: |
          python -X utf8 tools/dev_release.py preflight
          if ($LASTEXITCODE -ne 0) { throw 'Development preflight failed' }
          "EQOA_UPDATE_CHANNEL=enhanced-dev" >> $env:GITHUB_ENV
          "EQOA_BUILD_COMMIT=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_ENV
      - name: Fetch reviewed upstream policy base
        shell: pwsh
        run: |
          $base = (Get-Content docs/fork-footprint.json -Raw | ConvertFrom-Json).reviewed_base
          git fetch --no-tags https://github.com/DabDavis/eqoa-rust-client-vanilla.git $base
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch reviewed upstream base' }
          git update-ref refs/remotes/origin/master $base
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Check fork integration policy
        run: python -X utf8 tools/check_fork_footprint.py
      - name: Test release tooling
        run: python -X utf8 -m unittest discover -s tools -p "test_*.py"
      - name: Test workspace
        shell: pwsh
        env:
          EQOA_CONFIG: ${{ runner.temp }}/eqoa-dev-config
        run: |
          New-Item -ItemType Directory -Force -Path $env:EQOA_CONFIG | Out-Null
          # Upstream's AO test `the_foot_of_a_wall_darkened_and_open_ground_not` depends on the GPU
          # (it fails on untouched upstream 91f9e72 and on this runner); skipped until upstream fixes it.
          cargo +1.99.1 test --locked --workspace --target x86_64-pc-windows-msvc -- --test-threads=1 --skip the_foot_of_a_wall_darkened_and_open_ground_not
          if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed' }
      - name: Require optimized zero-addon allocation gate
        shell: pwsh
        env:
          EQOA_CONFIG: ${{ runner.temp }}/eqoa-zero-addon-config
        run: |
          New-Item -ItemType Directory -Force -Path $env:EQOA_CONFIG | Out-Null
          $gateOutput = cargo +1.99.1 test --release --locked -p eqoa --bin eqoa --target x86_64-pc-windows-msvc play::fork_hooks::native_tests::performance_busy_world_zero_addons_frame_and_packet_allocation_bound -- --exact --test-threads=1 --nocapture 2>&1
          $gateExit = $LASTEXITCODE
          $gateOutput | Write-Output
          if ($gateExit -ne 0 -or -not ($gateOutput -match 'test result: ok\. 1 passed;')) { throw 'Optimized zero-addon allocation gate failed' }
      - name: Build development Windows client
        run: cargo +1.99.1 build --release --locked -p eqoa --target x86_64-pc-windows-msvc
      - name: Package exact runtime allowlist
        run: python -X utf8 tools/build_player_release.py --executable target/x86_64-pc-windows-msvc/release/eqoa.exe --output run/player-release --channel enhanced-dev
      - uses: actions/upload-artifact@v6
        with:
          name: dev-runtime
          path: run/player-release/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: windows
    if: github.repository == 'LoopRook/eqoa-enhanced'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Never cancelled: a half-replaced release would leave dev updates failing
    # until the next publication. A stale run stops at the superseded check.
    concurrency:
      group: enhanced-dev-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.windows.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch develop for the superseded check
        run: git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
      - uses: actions/download-artifact@v7
        with:
          name: dev-runtime
          path: ${{ runner.temp }}/dev-runtime
      - name: Publish the rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -X utf8 tools/dev_release.py publish --assets "$RUNNER_TEMP/dev-runtime"
